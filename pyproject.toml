[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chorale"
version = "1.1.0"
description = "HarmoniSATB Studio — rekam paduan suara SATB + piano dan master siap YouTube"
requires-python = ">=3.12,<3.13"

[project.gui-scripts]
harmonisatb = "chorale.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chorale.ui" = ["style.qss", "fonts/*.otf", "fonts/*.ttf", "fonts/*.txt", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
